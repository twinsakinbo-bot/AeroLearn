[package]
name = "aerolearn"
version = "1.0.2"
description = "AeroLearn Desktop Application"
authors = ["Aerolearn"]
edition = "2021"

[lib]
name = "aerolearn_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
incremental = false

[profile.dev]
codegen-units = 1
incremental = false

[profile.dev.build-override]
codegen-units = 1

[profile.release.build-override]
codegen-units = 1
